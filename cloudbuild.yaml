steps:
  # 0. Test and Lint
  - name: 'gcr.io/cloud-builders/npm'
    args: ['install']
  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'lint']
  - name: 'gcr.io/cloud-builders/npm'
    args: ['test']

  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ejwilliams-app:$COMMIT_SHA', '.']

  # 2. Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ejwilliams-app:$COMMIT_SHA']

  # 3. Migrate Database (Neon - no proxy needed)
  - name: 'gcr.io/$PROJECT_ID/ejwilliams-app:$COMMIT_SHA'
    entrypoint: 'node'
    args: ['prisma/deploy.js']
    env:
      - 'DATABASE_URL=$_DATABASE_URL'
      - 'ADMIN_PASSWORD=$_ADMIN_PASSWORD'
      - 'ADMIN_EMAIL=$_ADMIN_EMAIL'

  # 4. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ejwilliams-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ejwilliams-app:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Neon connection - no Cloud SQL instance needed
      - '--set-env-vars'
      - 'DATABASE_URL=$_DATABASE_URL'
      - '--set-env-vars'
      - 'AUTH_TRUST_HOST=true'
      - '--set-env-vars'
      - 'AUTH_SECRET=$_AUTH_SECRET'
      - '--set-env-vars'
      - 'EMAIL_SERVER_HOST=$_EMAIL_SERVER_HOST'
      - '--set-env-vars'
      - 'EMAIL_SERVER_PORT=$_EMAIL_SERVER_PORT'
      - '--set-env-vars'
      - 'EMAIL_SERVER_USER=$_EMAIL_SERVER_USER'
      - '--set-env-vars'
      - 'EMAIL_SERVER_PASSWORD=$_EMAIL_SERVER_PASSWORD'
      - '--set-env-vars'
      - 'EMAIL_FROM=$_EMAIL_FROM'

images:
  - 'gcr.io/$PROJECT_ID/ejwilliams-app:$COMMIT_SHA'

substitutions:
  _DATABASE_URL: 'postgresql://dummy:dummy@dummy/dummy' # Overwrite this in Trigger configuration with Neon connection string
  _AUTH_SECRET: 'dummy_secret_for_build' # Overwrite this in Trigger configuration
  _ADMIN_PASSWORD: 'password123' # Overwrite this in Trigger configuration
  _ADMIN_EMAIL: 'admin@lodge141.com'
  _EMAIL_SERVER_HOST: 'smtp-relay.brevo.com'
  _EMAIL_SERVER_PORT: '587'
  _EMAIL_SERVER_USER: 'dummy'
  _EMAIL_SERVER_PASSWORD: 'dummy'
  _EMAIL_FROM: 'noreply@lodge141.com' # Overwrite this in Trigger configuration
